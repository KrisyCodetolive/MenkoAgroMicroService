spring:
  application:
    name: menko-agro-api

  datasource:
    url: jdbc:postgresql://localhost:54332/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:menko-agro-secret-key-change-in-production-min-256-bits}
    expiration-ms: 86400000
